version: 2

updates:
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
    day: "sunday"
  open-pull-requests-limit: 5
  labels:
    - "Type: Dependency Upgrade"
    - "Priority 1: Must"
  groups:
    github-dependencies:
      update-types:
        - "patch"
        - "minor"
        - "major"

- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: weekly
    day: "sunday"
  open-pull-requests-limit: 5
  labels:
    - "Type: Dependency Upgrade"
    - "Priority 1: Must"
  ignore:
    # The build uses the cssnano 4 API with postcss 7 (through gulp-postcss 8). cssnano 5+ needs a rewrite of the build task.
    - dependency-name: "cssnano"
      update-types: ["version-update:semver-major"]
  groups:
    npm-dependencies:
      update-types:
        - "patch"
        - "minor"
        - "major"
